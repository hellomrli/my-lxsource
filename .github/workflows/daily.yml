name: daily-source-check

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    paths:
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "config.json"
      - "package.json"
      - ".github/workflows/**"
      - ".github/dependabot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: install OS sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap util-linux
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: offline regression tests
        run: npm test

  check:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: install OS sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap util-linux
          # Ubuntu runner AppArmor can prevent unprivileged user namespaces.
          # This is an ephemeral, secret-free runner; the source sandbox itself is still mandatory.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: restore source state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state.json
          key: source-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            source-state-${{ github.ref_name }}-

      - name: fetch upstream
        run: node scripts/fetch-upstream.mjs

      - name: test sources (L1/L2/L3)
        run: node scripts/test-sources.mjs

      - name: build merged source
        run: node scripts/build-source.mjs

      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics
          path: |
            state.json
            reports/health.json
            reports/health.md
          retention-days: 7
          if-no-files-found: warn

      - name: upload publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication
          path: |
            reports/health.md
            dist/merged-source.js
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: check
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication
          path: ${{ runner.temp }}/publication

      - name: commit published files
        env:
          CHECKED_SHA: ${{ github.sha }}
          PUBLICATION_DIR: ${{ runner.temp }}/publication
        run: |
          # Do not overwrite newer source or configuration changes with stale results.
          git fetch -q origin master
          if [ "$(git rev-parse origin/master)" != "$CHECKED_SHA" ]; then
            echo "::error::master advanced during the check; run a new check before publishing"
            exit 1
          fi
          mkdir -p reports dist
          cp "$PUBLICATION_DIR/reports/health.md" reports/health.md
          cp "$PUBLICATION_DIR/dist/merged-source.js" dist/merged-source.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/health.md dist/merged-source.js
          if git diff --staged --quiet; then
            echo "no published changes"
            exit 0
          fi
          git commit -m "chore: daily check"
          git push origin HEAD:master
